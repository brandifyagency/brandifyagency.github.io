<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brandify | Digital Marketing</title>
<meta name="description" content="Brandify — Social Media Management, Paid Ads and Branding.">
<style>
:root {
  --bg:#07070b; --card:#11111a; --text:#fff; --muted:#b9bac7;
  --accent1:#4c7dff; --accent2:#b33cff; --line:#252535;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 50% 0%,rgba(100,60,255,.25),transparent 35%),
var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
main{width:min(560px,92%);margin:0 auto;padding:42px 0 30px;text-align:center}
.logo{width:112px;height:112px;border-radius:50%;object-fit:cover;border:2px solid #222236;box-shadow:0 10px 35px rgba(0,0,0,.45)}
h1{font-size:30px;margin:18px 0 6px;letter-spacing:-.5px}
.handle{color:#aeb0c0;margin-bottom:18px}
.bio{color:#dddde7;line-height:1.55;font-size:15px;margin:0 auto 25px;max-width:460px}
.links{display:grid;gap:12px}
a{text-decoration:none;color:white}
.btn{display:flex;align-items:center;justify-content:center;min-height:58px;padding:0 20px;border:1px solid var(--line);
border-radius:16px;background:linear-gradient(135deg,#151522,#0e0e16);font-weight:700;transition:.15s}
.btn:hover{transform:translateY(-1px);border-color:#45455e}
.primary{background:linear-gradient(135deg,var(--accent1),var(--accent2));border:0}
.section{margin:28px 0 12px;text-transform:uppercase;font-size:11px;letter-spacing:2px;color:#858698}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}
.service{padding:14px 8px;border:1px solid var(--line);border-radius:14px;background:#0e0e15;font-size:12px;color:#e5e5ed}
footer{margin-top:30px;color:#737487;font-size:12px}
@media(max-width:430px){.services{grid-template-columns:1fr}}
</style>
</head>
